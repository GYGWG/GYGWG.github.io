<div class="projects">
  <div class="row row-cols-1 row-cols-md-3">
    {% assign ordered_projects = site.projects | sort: "importance" %}
    {% for project in ordered_projects %}
    <div class="col">
      <a href="{{ project.external_url }}" class="project-link">
        <div class="card h-100 hoverable">
          <figure class="project-media">
            {% if project.mosaic %}{% include roboedit.html %}{% else %}
            <img src="{{ project.image }}" class="card-img-top" alt="{{ project.alt | escape }}">
            {% endif %}
          </figure>
          <div class="card-body">
            <h2 class="card-title">{{ project.title }}</h2>
            <p class="card-text">{{ project.description }}</p>
          </div>
        </div>
      </a>
    </div>
    {% endfor %}
  </div>
</div>
